[project]
name = "mcp-aws"
version = "0.1.0"
description = "Read-only AWS MCP server with a fixed tool surface over a declarative catalog"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=2.2.0",
    "boto3>=1.35.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-aws = "mcp_aws.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_aws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
